    <input placeholder="Password" id="password" type="password">
    <button onclick="login()">Login</button>

    <input placeholder="Username" id="regUsername">
    <input placeholder="Email" id="regEmail">
    <input placeholder="Password" id="regPassword" type="password">

    <div class="main">
        <h2>List</h2>
        <input placeholder="Item" id="userNote">
        <button onClick="sendToNotesTableUserInput()">Add to List</button>

                <tr>

        <h2>Recommendations</h2>

                    <th>Item</th>
                    <th>Last Purchased</th>
                    <th>Average Purchase Frequency</th>
                    <th>Options</th>
                </tr>
