<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeter</title>
</head>
<body>
    <h1>Greeter</h1>
    <h2>Who would you like to greet?</h2>
    <input id="greetUserInput" placeholder="Enter a name">
    <button onClick="greet()">Send</button>
    <p id="greetServerResponse"></p>

    <h1>Notes</h1>
    <h2>Send a note to the database</h2>
    <input placeholder="Enter your note here" id="userNote">
    <button onClick="sendToNotesTable()">Send</button>

    <h2>Look at the data in the database</h2>
    <button onClick="window.open('/notes')" >See whats in notes table</button>


    <script src="main.js"></script>
</body>
</html>
