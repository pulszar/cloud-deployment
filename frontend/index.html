<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <title>Grocery List</title>
</head>
<style>
table, th, td {
    border:1px solid black;
}
</style>
<body>
    <h1>Grocery List</h1>
    <h2>Add an item to the list</h2>
    <input placeholder="Item" id="userNote">
    <button onClick="sendToNotesTable()">Send</button>

    <table style="width:50%" id="groceryList">
        <thead>
            <tr>
                <th>Item</th>
                <th>Options</th>
            </tr>
        </thead>
        <!-- Placeholder tbody for dynamic js -->
        <tbody> </tbody> 
    </table>

    <h2>Recommendations</h2>

    <table style="width:50%" id="recommendationList">
        <thead>
            <tr>
                <th>Item</th>
            </tr>
        </thead>
        <!-- Placeholder tbody for dynamic js -->
        <tbody> </tbody> 
    </table>

    <script src="main.js"></script>
</body>
</html>
