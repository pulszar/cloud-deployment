<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeter</title>
</head>
<body>
    <h1>Greeter</h1>
    <h2>Who would you like to greet?</h2>
    <input id="userInput" placeholder="Enter a name">
    <button onClick="greet()">Send</button>
    <p id="serverResponse"></p>
    <script>
        async function greet() {
            const userInput = document.getElementById("userInput").value; // Get input
            console.log(userInput);
            const result = await fetch(`/greet/${userInput}`); // Send to server, get response
            console.log(result);
            const data = await result.json();
            document.getElementById("serverResponse").textContent = data.message; // Set placeholder element
        }
    </script>
</body>
</html>
